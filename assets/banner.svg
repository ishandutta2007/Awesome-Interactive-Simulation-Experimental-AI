<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <style>
      .glow-orb-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .orbit-particle {
        animation: floatParticle 6s ease-in-out infinite alternate;
      }
      .wave-path {
        animation: waveMotion 12s linear infinite;
      }
      .stream-line {
        stroke-dasharray: 8, 12;
        animation: dash 20s linear infinite;
      }
      @keyframes pulse1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        100% { transform: translate(40px, 30px) scale(1.2); opacity: 0.55; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.25; }
        100% { transform: translate(-50px, -20px) scale(1.3); opacity: 0.45; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-16px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind everything) -->
  <g>
    <circle class="glow-orb-1" cx="220" cy="120" r="180" fill="url(#glowGrad)" />
    <circle class="glow-orb-2" cx="980" cy="280" r="220" fill="url(#glowGrad)" />
    <circle class="glow-orb-1" cx="600" cy="350" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.8" />

  <!-- Dynamic Simulation Nodes & Connections in Background -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50,320 Q 300,180 600,260 T 1150,150" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="stream-line" d="M 80,80 Q 400,280 800,120 T 1120,320" fill="none" stroke="#a855f7" stroke-width="1.5" />
    
    <!-- Agent Simulation Nodes -->
    <g class="orbit-particle">
      <circle cx="160" cy="280" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
      <circle cx="320" cy="140" r="5" fill="#818cf8" filter="url(#softGlow)"/>
      <circle cx="880" cy="120" r="4" fill="#c084fc" filter="url(#softGlow)"/>
      <circle cx="1040" cy="240" r="6" fill="#38bdf8" filter="url(#softGlow)"/>
      <circle cx="480" cy="320" r="3.5" fill="#34d399" filter="url(#softGlow)"/>
      <circle cx="720" cy="90" r="4.5" fill="#f472b6" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- Foreground Content Container -->
  <g>
    <!-- Top Category Tag / Pill -->
    <g transform="translate(435, 45)">
      <rect x="0" y="0" width="330" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="20" cy="16" r="4.5" fill="#38bdf8" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="21" fill="#e2e8f0" class="pill-text" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" class="title-text" font-size="44" fill="url(#primaryGrad)" filter="url(#softGlow)">
      Interactive Simulation &amp; Experimental AI
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" text-anchor="middle" class="subtitle-text" font-size="18" fill="#94a3b8" letter-spacing="0.2">
      Agent-Based Modeling • Multi-Agent RL • System Dynamics • Digital Twins • Physics Engines
    </text>

    <!-- Feature Badges / Highlights (Fixed Foreground Row) -->
    <g transform="translate(180, 245)">
      <!-- Pill 1: ABM & MAS -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="90" y="26" text-anchor="middle" fill="#38bdf8" class="pill-text">🤖 Agent-Based (ABM)</text>
      </g>
      <!-- Pill 2: MARL Environments -->
      <g transform="translate(210, 0)">
        <rect width="200" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="100" y="26" text-anchor="middle" fill="#818cf8" class="pill-text">🧠 Multi-Agent RL &amp; Gym</text>
      </g>
      <!-- Pill 3: Digital Twins & SaaS -->
      <g transform="translate(440, 0)">
        <rect width="190" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="95" y="26" text-anchor="middle" fill="#c084fc" class="pill-text">☁️ SaaS &amp; Digital Twins</text>
      </g>
      <!-- Pill 4: Embodied AI & Physics -->
      <g transform="translate(660, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="90" y="26" text-anchor="middle" fill="#34d399" class="pill-text">⚡ Physics &amp; Embodied</text>
      </g>
    </g>

    <!-- Bottom Metric Accent Bar -->
    <g transform="translate(420, 325)">
      <text x="180" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" letter-spacing="1">
        FOSS TOOLS • COMMERCIAL SAAS • RESEARCH SANDBOXES
      </text>
    </g>
  </g>
</svg>
